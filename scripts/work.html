<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Browse Nazeeh Abdul-Hadi's public engineering repositories by project, discipline or technology. Source and upstream foundations remain identified."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Work · Nazeeh Abdul-Hadi" />
    <meta
      property="og:description"
      content="Engineering applications, scientific tools, libraries and open-source contributions."
    />
    <meta property="og:url" content="https://nazeeh111.github.io/work/" />
    <link rel="canonical" href="https://nazeeh111.github.io/work/" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link
      rel="preload"
      href="/assets/fonts/IBMPlexSans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/assets/design/portfolio.css" />
    <link rel="stylesheet" href="/assets/design/interior.css" />
    <link rel="stylesheet" href="/assets/design/discovery.css" />
    <script src="/assets/work.js" defer></script>
    <title>Work · Nazeeh Abdul-Hadi</title>
  </head>
  <body class="folio-interior work-register">
    <a class="skip" href="#main">Skip to content</a>
    <header class="folio-band">
      <div class="folio-width folio-nav">
        <a class="folio-mark" href="/" aria-label="Nazeeh Abdul-Hadi home">Nazeeh Abdul-Hadi</a>
        <nav aria-label="Main navigation"><a href="/work/" aria-current="page">Work</a><a href="/research/">Research</a><a href="/#about">About</a></nav>
      </div>
    </header>
    <main id="main">
      <div class="folio-band">
        <div class="folio-width register-intro">
          <h1>Work index</h1>
        </div>
      </div>
      <section class="folio-width register-body" id="projects" aria-label="Project index">
        <div class="filters" id="work-filters" hidden>
          <div>
            <label for="project-search">Search projects</label
            ><input
              id="project-search"
              name="q"
              type="search"
              placeholder="Name or topic"
              autocomplete="off"
              aria-controls="project-list"
            />
          </div>
          <div>
            <label for="project-subject">Discipline</label
            ><select
              id="project-subject"
              name="discipline"
              aria-controls="project-list"
            >
              <option value="">All disciplines</option>
              {{SUBJECTS}}
            </select>
          </div>
        </div>
        <div class="catalog-controls">
          <label class="case-filter" hidden><input id="browser-filter" name="browser" type="checkbox" aria-controls="project-list" /> Opens in browser</label>
          <label class="case-filter" hidden>
            <input id="case-filter" name="cases" type="checkbox" aria-controls="project-list" />
            Case studies only
          </label>
          <p
            id="catalog-status"
            class="catalog-status"
            role="status"
            aria-live="polite"
          >
            {{COUNT}} public repositories
          </p>
          <button type="button" id="reset-search" hidden>Clear filters</button>
        </div>
        <noscript><p>All repositories are listed below.</p></noscript>
        <div id="catalog-empty" class="empty" hidden>
          <h2>No matching results.</h2>
          <p id="catalog-empty-message">No projects match these filters.</p>
          <div class="empty-actions"><button class="button" id="search-all-disciplines" type="button" hidden>Search all disciplines</button><button class="button" id="empty-reset" type="button">Clear all filters</button></div>
        </div>
        <ul aria-label="Public repositories" class="project-list" id="project-list">
          {{PROJECTS}}
        </ul>
      </section>
    </main>
    <footer class="folio-band">
      <div class="folio-width interior-footer">
        <a href="/">Nazeeh Abdul-Hadi</a>
        <nav aria-label="Footer"><a href="/research/">Research</a><a href="https://github.com/nazeeh111">GitHub</a><a href="https://github.com/nazeeh111/nazeeh111.github.io">Site source</a></nav>
      </div>
    </footer>
  </body>
</html>
